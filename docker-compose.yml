version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    network_mode: host
    command: >
      sh -c "
      echo 'listener 29999' >> /mosquitto/config/mosquitto.conf &&
      echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "
