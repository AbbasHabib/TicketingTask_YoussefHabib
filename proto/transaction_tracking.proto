syntax = "proto3";

package ticketing;

import "google/protobuf/empty.proto";


message GateTicketsValidationReport {
    string machine_id = 1;
    int32 total_processed = 2;
    int32 valid_count = 3;  
    int32 invalid_count = 4;
}


message GetReportRequest {
    string machine_id = 1;
}


message GetReportResponse {
    GateTicketsValidationReport report = 1;
}

// Service definition
service TransactionTrackingService {
    rpc SubmitReport(GateTicketsValidationReport) returns (google.protobuf.Empty);

    rpc GetReport(GetReportRequest) returns (GetReportResponse);
}
